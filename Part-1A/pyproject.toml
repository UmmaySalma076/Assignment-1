[project]
name = "smart-todo-app"
version = "0.1.0"
description = "Smart Todo Application"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115.0",
  "pydantic>=2.8.0",
  "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-cov>=5.0.0",
  "httpx>=0.27.0",
  "ruff>=0.6.0",
  "bandit[toml]>=1.7.9",
]

[tool.setuptools]
packages = ["app", "app.api", "app.models", "app.repositories", "app.schemas", "app.services", "app.utils"]

[tool.pytest.ini_options]
pythonpath = ["."]

testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["specs/001-smart-todo/evidence/initial-source"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
